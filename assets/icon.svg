<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#0F1117" rx="256" />
  
  <!-- Gradient for the icon -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7" />
      <stop offset="100%" stop-color="#A29BFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central Circle / Dialpad Outline -->
  <circle cx="512" cy="512" r="350" fill="none" stroke="url(#grad)" stroke-width="40" stroke-dasharray="100 50" opacity="0.3" />

  <!-- Phone Handset -->
  <path 
    d="M685.2 758.8c-24.8 24.8-63.6 33.2-105.2 24-81.2-18-173.2-74-250-150.8-76.8-76.8-132.8-168.8-150.8-250-9.2-41.6-.8-80.4 24-105.2l67.2-67.2c26.8-26.8 69.2-28.8 98.4-5.2l76.4 61.2c26 20.8 31.6 57.6 12 83.6l-34 40.8c34 68 88.4 122.4 156.4 156.4l40.8-34c26-20.4 62.8-14.8 83.6 12l61.2 76.4c23.6 29.2 21.6 71.6-5.2 98.4l-67.2 67.2z" 
    fill="url(#grad)" 
    filter="url(#glow)"
  />

  <!-- Checkmark / Management symbol on top right of the phone -->
  <circle cx="680" cy="344" r="110" fill="#0F1117" stroke="url(#grad)" stroke-width="32" />
  <path d="M630 354l35 35 75-75" fill="none" stroke="#00D2A0" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Signal / Calling waves -->
  <path d="M730 200 a 300 300 0 0 1 120 120" fill="none" stroke="url(#grad)" stroke-width="32" stroke-linecap="round" opacity="0.8"/>
  <path d="M800 130 a 400 400 0 0 1 160 160" fill="none" stroke="url(#grad)" stroke-width="32" stroke-linecap="round" opacity="0.4"/>
</svg>
